<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100">
    <title>Filter chain with different regions</title>
    <desc>SourceGraphic has the size of the united region, while each filter must be applied with its own region.</desc>

    <filter id="filter1" x="-10%" y="-10%" width="120%" height="120%">
        <feFlood flood-color="green" flood-opacity="0.5"/>
        <feComposite in2="SourceGraphic" operator="atop"/>
    </filter>
    <filter id="filter2" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="2"/>
    </filter>
    <rect x="20" y="20" width="60" height="60" fill="red" filter="url(#filter1) url(#filter2)"/>
</svg>
